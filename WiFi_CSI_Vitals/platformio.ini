[common]
platform = espressif32
framework = arduino
monitor_speed = 921600

; Classic ESP32 = transmitter (plug into a wall adapter)
[env:tx]
extends = common
board = esp32dev
build_src_filter = -<*> +<tx/>
upload_port = COM4

; ESP32-S3 N8R8 = receiver + MAX30102 reference sensor (stays on the PC)
[env:rx]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_src_filter = -<*> +<rx/>
upload_port = COM3
monitor_port = COM3
